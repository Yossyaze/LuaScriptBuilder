<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lua Script Builder for Hammerspoon</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@9.4.3/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/flow-editor.css">
    <link rel="stylesheet" href="css/flow-lines.css">
  </head>
  <body>
    <div class="sticky-header" style="flex-direction: column; align-items: stretch; gap: 4px;">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; width: 100%;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <button class="btn-ghost" id="btnToggleSidebar" title="サイドバーの表示/非表示 (Cmd+B)" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border-radius: 8px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </button>
          <h1
            style="
              margin: 0;
              font-size: 1.3rem;
              font-family: var(--font-heading);
              color: #1b3650;
            "
          >
            Lua Script Builder
          </h1>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
          <div class="auth-section" id="authSection">
            <!-- ログインボタンまたはユーザー情報がここに挿入されます -->
          </div>
          <div class="actions" style="justify-content: flex-end; margin-top: 0; margin-left: auto;">
            <button class="btn-ghost btn-small" id="btnUndo" title="元に戻す (Cmd+Z)" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
            </button>
            <button class="btn-ghost btn-small" id="btnRedo" title="やり直す (Cmd+Shift+Z)" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
            </button>
            <button class="btn-ghost btn-small" id="btnExport" title="全データをエクスポート">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </button>
            <button class="btn-ghost btn-small" id="btnImport" title="データをインポート">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <input type="file" id="importFile" style="display: none;" accept=".json">
            <button class="btn-ghost btn-small" id="btnOpenSettings" title="各種設定" style="display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; padding: 0;">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <div style="width: 1px; height: 24px; background: var(--line); margin: 0 4px;"></div>
            <button class="btn-ghost" id="btnToggleOutput">生成Luaを表示</button>
            <button class="btn-ghost" id="btnDownload">保存 (init.lua)</button>
            <button class="btn-sub" id="btnCopy">クリップボードにコピー</button>
            <button class="btn-sub" id="btnSendToHammerspoon" style="background-color: #10b981; color: white; border: none; font-weight: bold;">Hammerspoonに送信</button>
            <button class="btn-main" id="btnGenerate" style="display: none;">スクリプト生成</button>
          </div>
        </div>
      </div>
      <!-- プロジェクト切り替えタブはヘッダーから左サイドバーに移行しました -->
    </div>

    <div class="wrap">
      <!-- 左ペイン: プロジェクトエクスプローラー（サイドバー） -->
      <aside class="project-sidebar card" id="projectSidebar">
        <div class="sidebar-header">
          <h2>プロジェクト</h2>
          <button type="button" class="btn-ghost btn-small tab-add" id="btnSidebarAddProject" title="新規プロジェクト作成" style="padding: 4px 8px !important; font-size: 1.1rem; line-height: 1; border-radius: 6px !important;">
            ＋
          </button>
        </div>
        <div class="project-list" id="projectSidebarList">
          <!-- JSで動的にプロジェクトツリーを生成 -->
        </div>
      </aside>

      <!-- 中央ペイン: エディタエリア -->
      <div class="editor-pane">

        <div class="main-columns">
          <section class="card">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px;">
              <h1 style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 1.35rem;">
                実行フロー: <span id="activeProjectNameDisplay" style="font-weight: 800; color: var(--theme-accent, var(--accent-2));"></span>
              </h1>
              <div id="projectPlatformBadge" class="flow-kind"></div>
            </div>
            <p style="margin-top: 8px;">
              1周の流れを可視化します。タブでリスト表示とグラフ表示を切り替えられます。
            </p>

            <div class="flow-tabs">
              <div class="flow-tab active" id="tabList">📝 リスト編集</div>
              <div class="flow-tab" id="tabGraph">🕸️ フロー図確認</div>
            </div>

            <div id="viewList">

              <div class="flow-shell">
                <div class="flow-track" id="flowTrack"></div>

              </div>
            </div>

            <div id="viewGraph" style="display: none">
              <div id="mermaidContainer" class="mermaid"></div>
            </div>
          </section>

          <section class="card sticky-sidebar">
            <div class="grid">
              <div class="span-2">
                <p class="section-title">アクション追加</p>
                <div class="flow-actions" style="margin-bottom: 20px">
                  <button type="button" class="flow-add-btn" id="btnFlowAddIPad">
                    ＋ iPad追加
                  </button>
                  <button
                    type="button"
                    class="flow-add-btn"
                    id="btnFlowAddIPhone"
                  >
                    ＋ iPhone追加
                  </button>
                  <button type="button" class="flow-add-btn" id="btnFlowAddDeviceSwitch" style="background-color: #e0f2fe; border-color: #bae6fd; color: #0369a1; display: none;">
                    ＋ デバイス切替
                  </button>
                  <button type="button" class="flow-add-btn" id="btnFlowAddKey">
                    ＋ KEY追加
                  </button>
                  <button type="button" class="flow-add-btn" id="btnFlowAddClick">
                    ＋ アプリクリック
                  </button>
                  <button type="button" class="flow-add-btn" id="btnFlowAddFocus">
                    ＋ アプリ前面
                  </button>
                  <button type="button" class="flow-add-btn" id="btnFlowAddCheck">
                    ＋ テキスト確認
                  </button>
                  <button type="button" class="flow-add-btn" id="btnFlowAddJump">
                    ＋ ジャンプ
                  </button>
                  <button type="button" class="flow-add-btn" id="btnFlowAddStop">
                    ＋ 停止
                  </button>
                  <button type="button" class="flow-add-btn" id="btnFlowAddBTT">
                    ＋ BTT
                  </button>
                  <button type="button" class="flow-add-btn" id="btnFlowAddShortcut">
                    ＋ ショートカット
                  </button>
                </div>
              </div>

              <div class="row span-2 row-toggle">
                <label for="enableLoop">実行をループさせる</label>
                <label class="toggle-switch">
                  <input type="checkbox" id="enableLoop" checked>
                  <span class="toggle-slider"></span>
                </label>
              </div>
            </div>
          </section>
        </div>
      </div>

      <section class="card output-card hidden" id="outputCard">
        <!-- 生成対象言語とプロジェクトの複数選択コントロール -->
        <div class="generation-controls" style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
            <span style="font-weight: bold; font-size: 0.9rem; color: var(--text-color, #1e293b);">生成対象言語:</span>
            <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.85rem; color: var(--text-color, #334155);">
              <input type="radio" name="genLanguage" value="lua" checked style="width: auto; margin: 0;" />

.477.488-.729.717zM22.359 17.504l.244.129c.162-.307.314-.625.449-.945l-.254-.107a11.27 11.27 0 0 1-.439.923zM23.617 13.629l.273.039c.049-.346.082-.695.102-1.043l-.275-.014c-.018.338-.051.682-.1 1.018zM23.156 15.621l.264.086c.107-.332.201-.67.279-1.01l-.268-.063c-.077.333-.169.665-.275.987zM22.453 6.672c.154.303.297.617.424.932l.256-.104c-.131-.322-.277-.643-.436-.953l-.244.125zM8.296 23.418c.331.107.67.201 1.009.279l.062-.268c-.331-.076-.663-.168-.986-.273l-.085.262zM10.335 23.889c.345.049.696.082 1.043.102l.014-.275c-.339-.018-.682-.051-1.019-.098l-.038.271zM17.326 22.449c-.303.154-.613.297-.926.424l.104.256c.318-.131.639-.275.947-.434l.004-.002-.123-.246-.006.002zM4.613 21.467c.274.213.562.418.854.605l.149-.23c-.285-.184-.565-.385-.833-.592l-.17.217zM12.417 23.725l.009.275c.348-.014.699-.041 1.045-.084l-.035-.271c-.336.041-.68.068-1.019.08zM6.37 22.604c.307.162.625.314.946.449l.107-.254c-.313-.133-.624-.279-.924-.439l-.129.244zM3.083 20.041c.233.258.48.51.734.746l.188-.201c-.249-.23-.49-.477-.717-.729l-.205.184zM14.445 23.475l.059.27c.34-.074.68-.162 1.014-.266l-.082-.262c-.325.099-.659.185-.991.258zM21.18.129A2.689 2.689 0 1 0 21.18 5.507 2.689 2.689 0 1 0 21.18.129zM15.324 15.447c0 .471.314.66.852.66.67 0 1.297-.396 1.297-1.016v-.645c-.23.107-.379.141-1.107.24-.735.109-1.042.306-1.042.761zM12 2.818c-5.07 0-9.18 4.109-9.18 9.18 0 5.068 4.11 9.18 9.18 9.18 5.07 0 9.18-4.111 9.18-9.18 0-5.07-4.11-9.18-9.18-9.18zm-2.487 13.77H5.771v-6.023h.769v5.346h2.974v.677zm4.13 0h-.619v-.67c-.405.57-.811.793-1.446.793-.843 0-1.38-.463-1.38-1.182v-3.271h.686v3c0 .52.347.85.893.85.719 0 1.181-.578 1.181-1.461v-2.389h.686v4.33zm-.53-8.393c0-1.484 1.205-2.689 2.689-2.689s2.688 1.205 2.688 2.689-1.203 2.688-2.688 2.688-2.689-1.203-2.689-2.688zm5.567 7.856v.52c-.223.059-.33.074-.471.074-.34 0-.637-.238-.711-.57-.381.406-.918.637-1.471.637-.877 0-1.422-.463-1.422-1.248 0-.527.256-.916.76-1.123.266-.107.414-.141 1.389-.264.545-.066.719-.191.719-.48v-.182c0-.412-.348-.645-.967-.645-.645 0-.957.24-1.016.77h-.693c.041-1 .686-1.404 1.734-1.404 1.066 0 1.627.412 1.627 1.182v2.412c0 .215.133.338.373.338.041-.002.074-.002.149-.017z"/></svg>
              Lua (Hammerspoon)
            </label>
            <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.85rem; color: var(--text-color, #334155);">
              <input type="radio" name="genLanguage" value="js" style="width: auto; margin: 0;" />
              <svg class="logo-icon js" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 2px;"><rect width="24" height="24" fill="#000000"/><path d="M0 0h24v24H0V0zm22.034 18.276c-.175-1.095-.888-2.015-3.003-2.873-.736-.345-1.554-.585-1.797-1.14-.091-.33-.105-.51-.046-.705.15-.646.915-.84 1.515-.66.39.12.75.42.976.9 1.034-.676 1.034-.676 1.755-1.125-.27-.42-.404-.601-.586-.78-.63-.705-1.469-1.065-2.834-1.034l-.705.089c-.676.165-1.32.525-1.71 1.005-1.14 1.291-.811 3.541.569 4.471 1.365 1.02 3.361 1.244 3.616 2.205.24 1.17-.87 1.545-1.966 1.41-.811-.18-1.26-.586-1.755-1.336l-1.83 1.051c.21.48.45.689.81 1.109 1.74 1.756 6.09 1.666 6.871-1.004.029-.09.24-.705.074-1.65l.046.067zm-8.983-7.245h-2.248c0 1.938-.009 3.864-.009 5.805 0 1.232.063 2.363-.138 2.711-.33.689-1.18.601-1.566.48-.396-.196-.597-.466-.83-.855-.063-.105-.11-.196-.127-.196l-1.825 1.125c.305.63.75 1.172 1.324 1.517.855.51 2.004.675 3.207.405.783-.226 1.458-.691 1.811-1.411.51-.93.402-2.07.397-3.346.012-2.054 0-4.109 0-6.179l.004-.056z"/></svg>
              JS (MultiKeyBoard)
            </label>
          </div>
          <div id="genProjectSelectContainer" style="display: flex; flex-direction: column; gap: 6px;">
            <span style="font-weight: bold; font-size: 0.9rem; color: var(--text-color, #1e293b);">生成対象プロジェクト:</span>
            <div id="genProjectList" style="display: flex; flex-wrap: wrap; gap: 10px; padding: 5px 0;">
              <!-- プロジェクトリストが動的に挿入されます -->
            </div>
          </div>
        </div>
        <div class="row">
          <label for="output" id="outputLabel">生成されたLua</label>
          <textarea id="output" spellcheck="false"></textarea>
        </div>
      </section>
    </div>

    <!-- 新規プロジェクト作成モーダル -->
    <div id="newProjectModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h2>新規プロジェクト作成</h2>
          <button type="button" class="modal-close-btn" id="btnCancelNewProjectX">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group" style="margin-bottom: 15px;">
            <label for="newProjectName" style="display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.9rem;">プロジェクト名</label>
            <input type="text" id="newProjectName" class="step-input" placeholder="例: 新規マクロ" style="width: 100%; box-sizing: border-box;" autocomplete="off" />
          </div>
          <div class="form-group">
            <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.9rem;">ターゲットプラットフォーム</label>
            <div class="platform-cards" style="display: flex; gap: 12px; flex-direction: column;">
              <label class="platform-card-label" style="display: block; cursor: pointer;">
                <input type="radio" name="newProjectPlatform" value="lua" checked style="display:none;" />
                <div class="platform-card active" id="cardPlatformLua" style="border: 2px solid #10b981; background: #f0fdf4; padding: 12px; border-radius: 8px; position: relative;">
                  <div style="font-weight: bold; font-size: 0.95rem; color: #166534; display: flex; align-items: center; gap: 8px;">

.693c.041-1 .686-1.404 1.734-1.404 1.066 0 1.627.412 1.627 1.182v2.412c0 .215.133.338.373.338.041-.002.074-.002.149-.017z"/></svg>
                    Lua (Hammerspoon)
                  </div>
                  <div style="font-size: 0.78rem; color: #15803d; margin-top: 4px;">macOSシステム全体のキー・クリック自動化スクリプトを生成します。</div>
                </div>
              </label>
              <label class="platform-card-label" style="display: block; cursor: pointer;">
                <input type="radio" name="newProjectPlatform" value="js" style="display:none;" />
                <div class="platform-card" id="cardPlatformJs" style="border: 2px solid #e2e8f0; background: var(--bg-card, #fff); padding: 12px; border-radius: 8px; position: relative;">
                  <div style="font-weight: bold; font-size: 0.95rem; color: #1e293b; display: flex; align-items: center; gap: 8px;">
                    <svg class="logo-icon js" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect width="24" height="24" fill="#000000"/><path d="M0 0h24v24H0V0zm22.034 18.276c-.175-1.095-.888-2.015-3.003-2.873-.736-.345-1.554-.585-1.797-1.14-.091-.33-.105-.51-.046-.705.15-.646.915-.84 1.515-.66.39.12.75.42.976.9 1.034-.676 1.034-.676 1.755-1.125-.27-.42-.404-.601-.586-.78-.63-.705-1.469-1.065-2.834-1.034l-.705.089c-.676.165-1.32.525-1.71 1.005-1.14 1.291-.811 3.541.569 4.471 1.365 1.02 3.361 1.244 3.616 2.205.24 1.17-.87 1.545-1.966 1.41-.811-.18-1.26-.586-1.755-1.336l-1.83 1.051c.21.48.45.689.81 1.109 1.74 1.756 6.09 1.666 6.871-1.004.029-.09.24-.705.074-1.65l.046.067zm-8.983-7.245h-2.248c0 1.938-.009 3.864-.009 5.805 0 1.232.063 2.363-.138 2.711-.33.689-1.18.601-1.566.48-.396-.196-.597-.466-.83-.855-.063-.105-.11-.196-.127-.196l-1.825 1.125c.305.63.75 1.172 1.324 1.517.855.51 2.004.675 3.207.405.783-.226 1.458-.691 1.811-1.411.51-.93.402-2.07.397-3.346.012-2.054 0-4.109 0-6.179l.004-.056z"/></svg>
                    JS (MultiKeyBoard)
                  </div>
                  <div style="font-size: 0.78rem; color: #64748b; margin-top: 4px;">開発中アプリ MultiKeyBoard 用の入力マクロを JavaScript 形式で生成します。</div>
                </div>
              </label>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
          <button type="button" class="btn-ghost" id="btnCancelNewProject">キャンセル</button>
          <button type="button" class="btn-main" id="btnConfirmNewProject">作成</button>
        </div>
      </div>
    </div>

    <!-- 設定サイドパネル -->
    <div id="settingsPanel" class="settings-panel hidden">
      <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--line, #e2e8f0);">
        <h2 style="margin: 0; font-size: 1.1rem; font-family: var(--font-heading); color: #1b3650;">⚙️ 各種設定</h2>
        <button type="button" class="close-btn" id="btnCloseSettings" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b;">&times;</button>
      </div>
      <div class="panel-body" style="padding: 20px; overflow-y: auto; max-height: calc(100vh - 70px); box-sizing: border-box;">
        
        <div class="settings-section">
          <h3 style="margin-top: 0; margin-bottom: 10px; font-size: 0.95rem; border-left: 3px solid #0ea5e9; padding-left: 8px; color: #1e293b;">アクティブプロジェクト設定 (個別)</h3>
          <div class="grid">
            <div class="row">
              <label for="startHotkeyDisplay">開始ホットキー</label>
              <div class="hotkey-controls">
                <input id="startHotkeyDisplay" class="hotkey-display" readonly />
                <button type="button" class="btn-ghost record-btn" data-hotkey="start">記録</button>
                <button type="button" class="btn-ghost clear-btn" data-hotkey="start">クリア</button>
              </div>
            </div>
            <div class="row">
              <label for="stopHotkeyDisplay">停止ホットキー</label>
              <div class="hotkey-controls">
                <input id="stopHotkeyDisplay" class="hotkey-display" readonly />
                <button type="button" class="btn-ghost record-btn" data-hotkey="stop">記録</button>
                <button type="button" class="btn-ghost clear-btn" data-hotkey="stop">クリア</button>
              </div>
            </div>
            <div class="row span-2 row-toggle" style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
              <label for="enableTimelineLog">時系列ログを有効にする</label>
              <label class="toggle-switch">
                <input type="checkbox" id="enableTimelineLog" checked>
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div class="row span-2 row-toggle" style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
              <label for="enableAutoStopLog">自動停止時にログを保存する</label>
              <label class="toggle-switch">
                <input type="checkbox" id="enableAutoStopLog" checked>
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div class="row span-2 row-toggle" style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
              <label for="enableExecutionAlert">各ステップのアラート表示</label>
              <label class="toggle-switch">
                <input type="checkbox" id="enableExecutionAlert">
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div class="row" style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; border-top: 1px dashed var(--line, #e2e8f0); padding-top: 12px;">
              <label for="projectPlatformSelect" style="font-weight: bold; color: var(--text-main, #1e293b); font-size: 0.9rem;">ターゲットプラットフォーム</label>
              <select id="projectPlatformSelect" class="step-input" style="width: 180px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line, #e2e8f0); background-color: var(--bg-input, #fff); font-size: 0.85rem; font-family: inherit;">
                <option value="lua">Lua (Hammerspoon)</option>
                <option value="js">JS (MultiKeyBoard)</option>
              </select>
            </div>
          </div>
        </div>

        <div class="settings-section" style="margin-top: 25px; border-top: 1px solid var(--line, #e2e8f0); padding-top: 15px;">
          <h3 style="margin-top: 0; margin-bottom: 10px; font-size: 0.95rem; border-left: 3px solid #10b981; padding-left: 8px; color: #1e293b;">共通ホットキー設定 (グローバル)</h3>
          <div class="grid">
            <div class="row">
              <label for="ipadMoveHotkeyDisplay">iPad切り替え</label>
              <div class="hotkey-controls">
                <input id="ipadMoveHotkeyDisplay" class="hotkey-display" readonly />
                <button type="button" class="btn-ghost record-btn" data-hotkey="ipadMove">記録</button>
              </div>
            </div>
            <div class="row">
              <label for="iphoneMoveHotkeyDisplay">iPhone切り替え</label>
              <div class="hotkey-controls">
                <input id="iphoneMoveHotkeyDisplay" class="hotkey-display" readonly />
                <button type="button" class="btn-ghost record-btn" data-hotkey="iphoneMove">記録</button>
              </div>
            </div>
            <div class="row">
              <label for="reloadHotkeyDisplay">再読込キー</label>
              <div class="hotkey-controls">
                <input id="reloadHotkeyDisplay" class="hotkey-display" readonly />
                <button type="button" class="btn-ghost record-btn" data-hotkey="reload">記録</button>
              </div>
            </div>
            <div class="row">
              <label for="stopAllHotkeyDisplay">一括停止キー</label>
              <div class="hotkey-controls">
                <input id="stopAllHotkeyDisplay" class="hotkey-display" readonly />
                <button type="button" class="btn-ghost record-btn" data-hotkey="stopAll">記録</button>
              </div>
            </div>
          </div>
        </div>

        <div class="settings-section" style="margin-top: 25px; border-top: 1px solid var(--line, #e2e8f0); padding-top: 15px;">
          <h3 style="margin-top: 0; margin-bottom: 10px; font-size: 0.95rem; border-left: 3px solid #f5b041; padding-left: 8px; color: #1e293b;">デフォルト待機時間 (秒)</h3>
          <div class="grid">
            <div class="row" style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
              <label for="settleIPad">iPad切り替え後</label>
              <input id="settleIPad" type="number" min="0" step="0.05" value="1.00" class="step-input" style="width: 70px;" />
            </div>
            <div class="row" style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
              <label for="settleIPhone">iPhone切り替え後</label>
              <input id="settleIPhone" type="number" min="0" step="0.05" value="1.00" class="step-input" style="width: 70px;" />
            </div>
            <div class="row" style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
              <label for="waitKey">キー入力後</label>
              <input id="waitKey" type="number" min="0" step="0.1" value="0.25" class="step-input" style="width: 70px;" />
            </div>
            <div class="row" style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
              <label for="settleBeforeKey">フォーカス後</label>
              <input id="settleBeforeKey" type="number" min="0" step="0.05" value="0.20" class="step-input" style="width: 70px;" />
            </div>
            <div class="row" style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
              <label for="waitClick">クリック後</label>
              <input id="waitClick" type="number" min="0" step="0.05" value="0.25" class="step-input" style="width: 70px;" />
            </div>
            <div class="row" style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
              <label for="waitFocus">前面フォーカス後</label>
              <input id="waitFocus" type="number" min="0" step="0.05" value="0.25" class="step-input" style="width: 70px;" />
            </div>
            <div class="row" style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
              <label for="waitCheck">テキスト確認後</label>
              <input id="waitCheck" type="number" min="0" step="0.05" value="0.25" class="step-input" style="width: 70px;" />
            </div>
            <div class="row" style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
              <label for="waitBtt">BTTトリガー後</label>
              <input id="waitBtt" type="number" min="0" step="0.05" value="0.25" class="step-input" style="width: 70px;" />
            </div>
            <div class="row" style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
              <label for="waitShortcut">ショートカット後</label>
              <input id="waitShortcut" type="number" min="0" step="0.05" value="0.25" class="step-input" style="width: 70px;" />
            </div>
            <div class="row span-2" style="margin-top: 15px;">
              <button type="button" class="btn-ghost" id="btnApplyAllWait" style="width: 100%; background: #f0fdf4; border-color: #bbf7d0; color: #166534; font-weight: 700; padding: 8px;">現在の全ステップに上記秒数を一斉適用</button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- トースト通知用のステータス表示エリア -->
    <div id="status"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
